[general]
	renderProfilingEnabled = false
	compactKeybindTextLimitEnabled = true
	# Default: 32
	# Range: 8 ~ 80
	maxCompactKeybindTextLength = 32
	legendCollapsed = false
	selectedKeybindSet = ""
	categoryHelpVisible = true
	editHelpVisible = true
	searchHelpVisible = true
	setsHelpVisible = true
	# Default: 1
	# Range: 1 ~ 2
	defaultPixelScale = 1
	keyboardLayout = "US_QWERTY"
	animationsEnabled = true
	hiddenBindingsEnabled = true
	categoriesEnabled = true
	fKeysEnabled = false
	allKeysEnabled = true
	alternatingLineColorsEnabled = true
	# Default: 0.4000000059604645
	# Range: 0.0 ~ 1.0
	panelOpacity = 0.4000000059604645
	# Default: 3
	# Range: 1 ~ 20
	maxUnhoveredAssignments = 3

[layout]
	#Scales the box width limit. Text still determines the actual width.
	# Default: 100
	# Range: 60 ~ 160
	box_width = 100
	#Scales vertical padding and row spacing without clipping text.
	# Default: 100
	# Range: 60 ~ 200
	box_height = 100
	#Minimum preferred space between info boxes.
	# Default: 5
	# Range: 0 ~ 20
	box_gap = 5
	#Space above the keyboard before the first box lane.
	# Default: 17
	# Range: 4 ~ 40
	top_gap = 17
	#Space below the keyboard before the first box lane.
	# Default: 15
	# Range: 4 ~ 40
	bottom_gap = 15
	#Space between the keyboard and side boxes.
	# Default: 10
	# Range: 2 ~ 32
	side_gap = 10
	#Higher values favor straighter lines. Lower values allow more turns.
	# Default: 18
	# Range: 0 ~ 80
	bend_cost = 18
	#Penalty for crossing another connector when a crossing is necessary.
	# Default: 1400
	# Range: 0 ~ 3000
	crossing_cost = 1400
	#Higher values discourage lines from running immediately beside each other.
	# Default: 10
	# Range: 0 ~ 40
	line_separation = 10
	#Keep assigned keys as routing obstacles, except the source key.
	avoid_keys = true
	#Try a crossing-free route first; allow crossings as a fallback.
	avoid_crossings = true
	#Use the existing smaller text and widths when many boxes are visible.
	auto_compact = true

