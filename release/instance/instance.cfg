[General]
ConfigVersion=1.2
InstanceType=OneSix
name=Iron Meridian
iconKey=default
OverrideMemory=true
MaxMemAlloc=10240
MinMemAlloc=10240
OverrideCommands=true
OverrideJavaArgs=true
JvmArgs="-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:InitiatingHeapOccupancyPercent=15 -XX:SurvivorRatio=32 -XX:MaxTenuringThreshold=1"
PreLaunchCommand="\"$INST_JAVA\" -jar packwiz-installer-bootstrap.jar https://raw.githubusercontent.com/marcelofabianov/iron-meridian/main/pack.toml"
